[package]
name = "xmip-core-authorize-party"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authorize-party"
description = "Party authorization: an allow-list of Parties, kept for everywhere, per Location and per Contract; an identity that resolved to no Party is refused. A xmip-core-authorize technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The facts it judges are context's and the layer it
# answers for is core's; standard library otherwise.
authorize = { workspace = true }
context = { workspace = true }
xcore = { workspace = true }

[lints]
workspace = true
